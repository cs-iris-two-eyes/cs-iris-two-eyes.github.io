<h1>TikTok authorization</h1>
<p id="msg">Reading the authorization result…</p>
<script>
    /* 25/11/2026 : le code d'autorisation n'est jamais affiché (rien d'inutile à l'écran). L'outil local lit l'adresse de cette page. */
    var p = new URLSearchParams(location.search), msg = document.getElementById("msg");
    if (p.get("code")) msg.textContent = "Authorization granted. Copy this page's full address back into the publishing tool, then close this page.";
    else if (p.get("error")) msg.textContent = "Authorization refused or failed. You can close this page.";
    else msg.textContent = "No authorization result on this page.";
  </script>
