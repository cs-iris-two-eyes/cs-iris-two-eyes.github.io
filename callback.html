<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok authorization — Iris Two Eyes</title>
<style>body{font-family:Georgia,serif;max-width:680px;margin:48px auto;padding:0 20px;line-height:1.6;color:#222}code{display:block;padding:12px;background:#f2f2f2;word-break:break-all}</style></head>
<body>
<h1>TikTok authorization</h1>
<p id="msg">Reading the authorization result…</p>
<code id="code"></code>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get("code"), err = p.get("error");
  var msg = document.getElementById("msg"), box = document.getElementById("code");
  if (code) { msg.textContent = "Authorization granted. Copy this code back into the publishing tool (it expires in a few minutes):"; box.textContent = code; }
  else if (err) { msg.textContent = "Authorization refused or failed: " + err + " " + (p.get("error_description") || ""); box.style.display = "none"; }
  else { msg.textContent = "No authorization result in this address."; box.style.display = "none"; }
</script>
<p><a href="index.html">Back</a></p>
</body></html>
